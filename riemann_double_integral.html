<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Double integral as a Riemann sum</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #faf9f5;
    --panel: #ffffff;
    --ink: #2c2c2a;
    --muted: #5f5e5a;
    --line: rgba(0,0,0,0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1f1e1c; --panel:#262522; --ink:#f0eee6; --muted:#b4b2a9; --line:rgba(255,255,255,0.12); }
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 12px; font-size: 14px; color: var(--muted); }
  .controls label { display: flex; align-items: center; gap: 8px; }
  .controls input[type=range] { width: 180px; }
  .readout { color: var(--ink); font-weight: 500; }
  #stage { width: 100%; height: 540px; background: rgba(0,0,0,0.04); border-radius: 8px; overflow: hidden; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .formula { font-family: "Times New Roman", serif; font-style: italic; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Double integral as a Riemann sum</h1>
  <p class="sub">Surface <span class="formula">f(x, y) = 2 + sin(x)·cos(y)</span> over <span class="formula">R = [0, π] × [0, π]</span>, approximated by rectangular prisms.</p>

  <div class="card">
    <div class="controls">
      <label>Subdivisions n
        <input type="range" id="n" min="2" max="40" step="1" value="10" />
        <span id="n-out" class="readout">10</span>
      </label>
      <label><input type="checkbox" id="surf" checked /> Show surface</label>
      <label><input type="checkbox" id="prisms" checked /> Show prisms</label>
      <label>Sample point
        <select id="sample">
          <option value="mid" selected>midpoint</option>
          <option value="ll">lower-left</option>
          <option value="ur">upper-right</option>
        </select>
      </label>
      <span style="margin-left:auto;">Approx volume: <span id="vol" class="readout">0</span></span>
    </div>

    <div id="stage"></div>
    <p class="hint">Drag the canvas to rotate. Scroll to zoom.</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const stage = document.getElementById('stage');
  const W = stage.clientWidth, H = stage.clientHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, W/H, 0.1, 100);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.setSize(W, H);
  stage.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.65));
  const dir = new THREE.DirectionalLight(0xffffff, 0.7);
  dir.position.set(5, 8, 6);
  scene.add(dir);

  const L = 4;
  const A = 0, B = Math.PI;
  const C = 0, D = Math.PI;
  const f = (x, y) => 2 + Math.sin(x) * Math.cos(y);
  const HEIGHT_SCALE = 0.7;

  // floor
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(L, L),
    new THREE.MeshBasicMaterial({ color: 0xd8d4c8, transparent: true, opacity: 0.55, side: THREE.DoubleSide })
  );
  floor.rotation.x = -Math.PI/2;
  scene.add(floor);
  const floorEdge = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.PlaneGeometry(L, L)),
    new THREE.LineBasicMaterial({ color: 0x6b6760 })
  );
  floorEdge.rotation.x = -Math.PI/2;
  scene.add(floorEdge);

  // axis labels (small ticks)
  const axisMat = new THREE.LineBasicMaterial({ color: 0x444441 });
  scene.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-L/2, 0,  L/2 + 0.08),
      new THREE.Vector3( L/2, 0,  L/2 + 0.08),
    ]), axisMat));
  scene.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-L/2 - 0.08, 0, -L/2),
      new THREE.Vector3(-L/2 - 0.08, 0,  L/2),
    ]), axisMat));

  let surfaceMesh = null, surfaceWire = null;
  function buildSurface(){
    if (surfaceMesh) {
      scene.remove(surfaceMesh); surfaceMesh.geometry.dispose(); surfaceMesh.material.dispose();
      scene.remove(surfaceWire); surfaceWire.geometry.dispose(); surfaceWire.material.dispose();
    }
    const segs = 100;
    const geom = new THREE.PlaneGeometry(L, L, segs, segs);
    const pos = geom.attributes.position;
    for (let i = 0; i < pos.count; i++){
      const sx = pos.getX(i);
      const sy = pos.getY(i);
      const u = A + (sx/L + 0.5) * (B - A);
      // After rotation.x = -PI/2, plane local +Y maps to world -Z.
      // Prisms place v from C to D along world +Z, so flip: local +Y ↔ v = C.
      const v = D - (sy/L + 0.5) * (D - C);
      pos.setZ(i, f(u, v) * HEIGHT_SCALE);
    }
    geom.computeVertexNormals();
    surfaceMesh = new THREE.Mesh(
      geom,
      new THREE.MeshPhongMaterial({
        color: 0x7f77dd, transparent: true, opacity: 0.55,
        side: THREE.DoubleSide, shininess: 30,
      })
    );
    surfaceMesh.rotation.x = -Math.PI/2;
    scene.add(surfaceMesh);

    surfaceWire = new THREE.LineSegments(
      new THREE.WireframeGeometry(geom),
      new THREE.LineBasicMaterial({ color: 0x3c3489, transparent: true, opacity: 0.18 })
    );
    surfaceWire.rotation.x = -Math.PI/2;
    scene.add(surfaceWire);
  }
  buildSurface();

  let prismGroup = new THREE.Group();
  scene.add(prismGroup);
  function buildPrisms(n, sampleMode){
    scene.remove(prismGroup);
    prismGroup.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material && !Array.isArray(o.material)) o.material.dispose();
    });
    prismGroup = new THREE.Group();

    const dx = (B - A) / n, dy = (D - C) / n;
    const sdx = L / n, sdy = L / n;
    let total = 0;

    const boxMat = new THREE.MeshPhongMaterial({
      color: 0x1d9e75, transparent: true, opacity: 0.55, flatShading: true
    });
    const edgeMat = new THREE.LineBasicMaterial({
      color: 0x0f6e56, transparent: true, opacity: 0.85
    });

    let off = 0.5;
    if (sampleMode === 'll') off = 0;
    else if (sampleMode === 'ur') off = 1;

    for (let i = 0; i < n; i++){
      for (let j = 0; j < n; j++){
        const xs = A + (i + off) * dx;
        const ys = C + (j + off) * dy;
        const h = f(xs, ys);
        total += h * dx * dy;

        const visH = Math.max(0.001, h * HEIGHT_SCALE);
        const g = new THREE.BoxGeometry(sdx * 0.96, Math.abs(visH), sdy * 0.96);
        const cx = -L/2 + (i + 0.5) * sdx;
        const cz = -L/2 + (j + 0.5) * sdy;

        const mesh = new THREE.Mesh(g, boxMat);
        mesh.position.set(cx, visH/2, cz);
        prismGroup.add(mesh);

        const eg = new THREE.LineSegments(new THREE.EdgesGeometry(g), edgeMat);
        eg.position.copy(mesh.position);
        prismGroup.add(eg);
      }
    }
    scene.add(prismGroup);
    document.getElementById('vol').textContent = total.toFixed(4);
  }

  // orbit
  let rotY = 0.6, rotX = 0.5, radius = 11;
  function updateCam(){
    const cy = Math.cos(rotX) * radius;
    const r2 = Math.sin(rotX) * radius;
    camera.position.set(Math.sin(rotY)*r2, cy, Math.cos(rotY)*r2);
    camera.lookAt(0, 1.0, 0);
  }
  updateCam();

  let dragging = false, lx = 0, ly = 0;
  renderer.domElement.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; });
  window.addEventListener('pointerup', () => dragging = false);
  window.addEventListener('pointermove', e => {
    if (!dragging) return;
    rotY -= (e.clientX - lx) * 0.008;
    rotX = Math.max(0.1, Math.min(1.4, rotX - (e.clientY - ly) * 0.008));
    lx = e.clientX; ly = e.clientY;
    updateCam();
  });
  renderer.domElement.addEventListener('wheel', e => {
    e.preventDefault();
    radius = Math.max(5, Math.min(25, radius + e.deltaY * 0.01));
    updateCam();
  }, { passive: false });

  const nIn = document.getElementById('n');
  const nOut = document.getElementById('n-out');
  const surfChk = document.getElementById('surf');
  const prChk = document.getElementById('prisms');
  const sampleSel = document.getElementById('sample');

  function refresh(){
    nOut.textContent = nIn.value;
    buildPrisms(parseInt(nIn.value, 10), sampleSel.value);
    surfaceMesh.visible = surfChk.checked;
    surfaceWire.visible = surfChk.checked;
    prismGroup.visible = prChk.checked;
  }
  nIn.addEventListener('input', refresh);
  surfChk.addEventListener('change', refresh);
  prChk.addEventListener('change', refresh);
  sampleSel.addEventListener('change', refresh);
  refresh();

  function loop(){ renderer.render(scene, camera); requestAnimationFrame(loop); }
  loop();

  window.addEventListener('resize', () => {
    const w = stage.clientWidth, h = stage.clientHeight;
    camera.aspect = w/h; camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
})();
</script>
</body>
</html>
